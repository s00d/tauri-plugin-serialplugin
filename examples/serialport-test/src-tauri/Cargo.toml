[package]
name = "serialport-test"
version = "0.0.0"
description = "A Tauri App"
authors = ["you"]
license = ""
repository = ""
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
[lib]
name = "tauri_app_lib"
crate-type = ["staticlib", "cdylib", "lib"]

[build-dependencies]
# Keep the tauri minor aligned with @tauri-apps/api (Tauri CLI rejects mismatches).
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
tauri = { version = "2.12.5", features = [] }
tauri-plugin-serialplugin = { path = "../../../", features = ["ble"] }

[features]
# this feature is used for production builds or when `devPath` points to the filesystem
# DO NOT REMOVE!!
custom-protocol = ["tauri/custom-protocol"]
android-test-harness = ["tauri-plugin-serialplugin/android-test-harness"]
