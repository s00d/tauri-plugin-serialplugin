// Local-only mutation testing (PIT) of the unit-tested bridge code. Kept out of build.gradle:
// apps include android/ through their own settings, so a plugin applied there would break
// every consumer's build. Run from android/:
//   ./gradlew -I pitest.init.gradle pitestDebug
// Report in build/reports/pitest/. A surviving mutant means no test notices that change.
rootProject {
    // On the project's own build-script classpath, next to AGP (the plugin needs its classes).
    buildscript {
        repositories {
            gradlePluginPortal()
            google()
            mavenCentral()
        }
        dependencies {
            classpath("pl.droidsonroids.gradle:gradle-pitest-plugin:0.2.25")
        }
    }
    pluginManager.withPlugin("com.android.library") {
        apply plugin: "pl.droidsonroids.pitest"
        pitest {
            targetClasses = ["app.tauri.serialplugin.manager.*"]
            threads = 1
            outputFormats = ["HTML", "XML"]
            timestampedReports = false
            // Null checks the Kotlin compiler inserts (`Intrinsics.checkNotNull…`) are not behaviour.
            avoidCallsTo = ["kotlin.jvm.internal"]
        }
    }
}
