[workspace]
members = ["crates/android-usb-serial"]
exclude = [
    "examples/serialport-test/src-tauri",
    "examples/usb-driver-tester/rust",
]
resolver = "2"

[package]
name = "tauri-plugin-serialplugin"
version = "3.0.4"
description = "Tauri plugin for serial port access (desktop and Android)."
edition = "2021"
authors = ["s00d"]
license = "Apache-2.0 OR MIT"
rust-version = "1.79"
links = "tauri-plugin-serialplugin"
readme = "README.md"
repository = "https://github.com/s00d/tauri-plugin-serialplugin"
homepage = "https://github.com/s00d/tauri-plugin-serialplugin"
documentation = "https://docs.rs/tauri-plugin-serialplugin"
keywords = ["tauri-plugin", "serial", "serialport", "usb", "android"]
categories = ["hardware-support", "api-bindings"]
# Keep crate lean for crates.io; examples/tests/tooling stay in git.
exclude = [
    "examples/**",
    ".github/**",
    "docs/**",
    "banner.png",
    "tests/**",
    "scripts/**",
    "crates/**",
    "coverage/**",
    "test-results/**",
    "android/src/test/**",
    "android/BUILD_INSTRUCTIONS.md",
    "jest.config.js",
    ".jestignore",
    ".versionrc.json",
    "pnpm-lock.yaml",
    "pnpm-workspace.yaml",
    "tsconfig.json",
    "rollup.config.mjs",
]

[features]
android-test-harness = ["android-usb-serial/fake-transport"]

[package.metadata.docs.rs]
rustc-args = [ "--cfg", "docsrs" ]
rustdoc-args = [ "--cfg", "docsrs" ]
# Desktop APIs are the common docs.rs surface; Android JNI is cfg-gated.
targets = ["x86_64-unknown-linux-gnu"]

[package.metadata.platforms.support]
windows = { level = "full", notes = "" }
linux = { level = "full", notes = "" }
macos = { level = "full", notes = "" }
android = { level = "full", notes = "" }

[build-dependencies]
tauri-plugin = { version = "2", features = [ "build" ] }

[dependencies]
tauri = { version = "2" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[target.'cfg(target_os = "android")'.dependencies]
# Stay on 0.21 — 0.22 EnvUnowned / GlobalRef<T> breaks our JNI bridge.
jni = "0.21"
android-usb-serial = { path = "crates/android-usb-serial", version = "0.1.1" }
serialport = "4.10"
log = { version = "0.4", features = ["std"] }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
serialport = "4.10"

[dev-dependencies]
# `test` feature only for this crate's unit tests — keep it off the published dependency graph.
tauri = { version = "2", features = ["test"] }

[profile.release]
codegen-units = 1
lto = true
incremental = false
opt-level = "s"
