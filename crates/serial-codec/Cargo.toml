[package]
name = "serial-codec"
version = "0.1.1"
description = "Serial byte stream framing (Node serialport parser parity), AT response and URC parsing, SMS PDU (GSM 7-bit / UCS-2), USSD and 3GPP 27.010 CMUX frames"
edition = "2021"
rust-version = "1.85"
license = "MPL-2.0"
readme = "README.md"
repository = "https://github.com/s00d/tauri-plugin-serialplugin"
homepage = "https://github.com/s00d/tauri-plugin-serialplugin/tree/main/crates/serial-codec"
documentation = "https://docs.rs/serial-codec"
authors = ["s00d"]
keywords = ["serial", "at-commands", "sms", "cmux", "parser"]
categories = ["parser-implementations", "encoding", "hardware-support"]
# Ship only the library: tests/fixtures hold vectors taken from GPL/LGPL projects
# (see tests/fixtures/README.md) and stay in git only.
include = ["/src/**", "/README.md", "/LICENSE"]

[dependencies]
serde = { version = "1.0.185", features = ["derive"] }
regex-lite = "0.1"

[dev-dependencies]
serde_json = "1.0"
# proptest 1.12 needs rustc 1.88; keep the dev build on the 1.85 MSRV.
proptest = { version = ">=1.6, <1.12", default-features = false, features = ["std"] }

