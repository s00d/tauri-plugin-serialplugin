name: docs

# Builds the documentation site (docs/, Nuxt) and publishes it to GitHub Pages
# (https://s00d.github.io/tauri-plugin-serialplugin/, branch gh-pages). Started by the CI
# `release` job after a release, or by hand: Actions -> docs -> Run workflow
# (`gh workflow run docs.yml`). Never runs on push or pull requests.

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: docs
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: docs
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          package_json_file: docs/package.json

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: docs/pnpm-lock.yaml

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build (generate reference pages + nuxt generate)
        env:
          NUXT_APP_BASE_URL: /tauri-plugin-serialplugin/
        run: pnpm generate

      - name: Add .nojekyll
        run: touch .output/public/.nojekyll

      - name: Deploy to GitHub Pages
        uses: crazy-max/ghaction-github-pages@v5
        with:
          target_branch: gh-pages
          build_dir: docs/.output/public
          jekyll: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
