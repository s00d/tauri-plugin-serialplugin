# Nightly Android emulator JNI integration tests.
#
# Runs the FakeTransport harness via scripts/android-integration-ci.sh on an
# AVD (x86_64). Manual trigger + daily schedule; keep timeout generous for
# SDK/AVD cold start.

name: Nightly Android Integration

on:
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:

jobs:
  android-emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
    - uses: actions/checkout@v4

    - name: Enable KVM
      run: |
        echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
        sudo udevadm control --reload-rules
        sudo udevadm trigger --name-match=kvm

    - name: Setup Android integration
      uses: ./.github/actions/setup-android-integration
      with:
        install-emulator: "true"

    - name: Run connectedDebugAndroidTest on emulator
      uses: reactivecircus/android-emulator-runner@v2
      with:
        api-level: 34
        arch: x86_64
        target: google_apis
        force-avd-creation: false
        emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
        disable-animations: true
        script: |
          export ANDROID_INTEGRATION_NDK_ARCH=x86_64
          export ANDROID_NDK_HOME="${ANDROID_HOME}/ndk/27.2.12479018"
          export NDK_HOME="${ANDROID_NDK_HOME}"
          chmod +x scripts/android-integration-ci.sh
          ./scripts/android-integration-ci.sh test
