name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Linux system deps (webkit for tauri, udev for serialport/nusb)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libudev-dev pkg-config

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
          # Android targets are only checked on the Linux runner.
          targets: ${{ runner.os == 'Linux' && 'aarch64-linux-android,x86_64-linux-android' || '' }}
      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: iOS build check (tcp:// transport only on iOS)
        if: runner.os == 'macOS'
        run: |
          rustup target add aarch64-apple-ios aarch64-apple-ios-sim
          cargo clippy -p tauri-plugin-serialplugin --target aarch64-apple-ios -- -D warnings
          cargo clippy -p tauri-plugin-serialplugin --target aarch64-apple-ios-sim -- -D warnings

      - name: Rust tests (plugin + android-usb-serial host tests)
        run: cargo test --workspace

      - name: android-usb-serial driver tests (fake USB transport)
        run: cargo test -p android-usb-serial --features fake-transport,serialport-compat

      - name: JNI bridge regression (real JVM)
        if: runner.os == 'Linux'
        run: cargo test --manifest-path tests/jni-bridge/Cargo.toml

      # --- Linux runner also covers Android and the MSRV (one job per OS) ---
      - name: Android clippy (both ABIs, with and without the test harness)
        if: runner.os == 'Linux'
        run: |
          for t in aarch64-linux-android x86_64-linux-android; do
            cargo clippy -p tauri-plugin-serialplugin -p android-usb-serial --target $t --all-targets -- -D warnings
          done
          cargo clippy -p tauri-plugin-serialplugin --target aarch64-linux-android --all-targets --features android-test-harness -- -D warnings

      - name: MSRV (plugin 1.90, android-usb-serial 1.85)
        if: runner.os == 'Linux'
        run: |
          rustup toolchain install 1.90 1.85 --profile minimal
          cargo +1.90 check --workspace --all-targets
          cargo +1.85 check -p android-usb-serial --all-targets --features fake-transport,serialport-compat

      - uses: actions/setup-java@v4
        if: runner.os == 'Linux'
        with:
          distribution: temurin
          java-version: 17
      # Keep the Gradle distribution between runs: its download host flakes (504s,
      # timeouts), and a cached copy needs no network at all.
      - uses: actions/cache@v4
        if: runner.os == 'Linux'
        with:
          path: |
            ~/.gradle/wrapper/dists
            ~/.gradle/caches
          key: gradle-${{ hashFiles('android/gradle/wrapper/gradle-wrapper.properties', 'android/build.gradle', 'android/settings.gradle') }}
      # The Android clippy run above generated android/.tauri/tauri-api, which Gradle needs.
      - name: Kotlin lint + Robolectric tests
        if: runner.os == 'Linux'
        working-directory: android
        run: |
          for i in 1 2 3; do ./gradlew --no-daemon --version && break; sleep 20; done
          ./gradlew --no-daemon lintDebug test

      # pnpm version comes from package.json `packageManager`.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - name: Build guest-js and check dist (publint, attw, smoke)
        run: pnpm build
      - name: guest-js tests
        run: pnpm test
