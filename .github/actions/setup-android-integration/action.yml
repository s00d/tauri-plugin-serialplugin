name: Setup Android integration
description: Shared Node/Java/Rust/NDK/SDK setup and prebuild for Android integration jobs
inputs:
  install-emulator:
    description: Also install emulator and x86_64 system image
    required: false
    default: "false"
runs:
  using: composite
  steps:
    - name: Use Node.js 20.x
      uses: actions/setup-node@v4
      with:
        node-version: 20.x

    - name: Install pnpm
      uses: pnpm/action-setup@v2
      with:
        version: 9.15.4

    - name: Get pnpm store directory
      shell: bash
      run: echo "STORE_PATH=$(pnpm store path --silent)" >> "$GITHUB_ENV"

    - name: Setup pnpm cache
      uses: actions/cache@v4
      with:
        path: ${{ env.STORE_PATH }}
        key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
        restore-keys: |
          ${{ runner.os }}-pnpm-store-

    - name: Cache node_modules
      uses: actions/cache@v4
      with:
        path: |
          node_modules
          examples/*/node_modules
        key: ${{ runner.os }}-node-modules-${{ hashFiles('**/pnpm-lock.yaml') }}
        restore-keys: |
          ${{ runner.os }}-node-modules-

    - name: Cache Rust dependencies
      uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          ~/.cargo/bin
          target
          examples/*/target
        key: ${{ runner.os }}-android-cargo-${{ hashFiles('**/Cargo.lock') }}
        restore-keys: |
          ${{ runner.os }}-android-cargo-

    - name: Setup Java 17
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: 17

    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        targets: x86_64-linux-android

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Cache Android SDK packages
      uses: actions/cache@v4
      with:
        path: |
          ${{ env.ANDROID_HOME }}/ndk
          ${{ env.ANDROID_HOME }}/platforms
          ${{ env.ANDROID_HOME }}/build-tools
          ${{ env.ANDROID_HOME }}/platform-tools
          ${{ env.ANDROID_HOME }}/emulator
          ${{ env.ANDROID_HOME }}/system-images
        key: ${{ runner.os }}-android-sdk-34-ndk-27.2.12479018-${{ inputs.install-emulator }}
        restore-keys: |
          ${{ runner.os }}-android-sdk-34-ndk-27.2.12479018-

    - name: Install Android SDK packages
      shell: bash
      run: |
        yes | sdkmanager --licenses >/dev/null || true
        PACKAGES=(
          "platform-tools"
          "platforms;android-34"
          "build-tools;34.0.0"
          "ndk;27.2.12479018"
        )
        if [ "${{ inputs.install-emulator }}" = "true" ]; then
          PACKAGES+=(
            "emulator"
            "system-images;android-34;google_apis;x86_64"
          )
        fi
        sdkmanager "${PACKAGES[@]}"

    - name: Install cargo-ndk
      shell: bash
      run: cargo install cargo-ndk --locked

    - name: Install dependencies
      shell: bash
      run: pnpm install

    - name: Build JS
      shell: bash
      run: pnpm build

    - name: Relink workspace packages
      shell: bash
      run: pnpm install

    - name: Prebuild Android integration artifacts
      shell: bash
      env:
        ANDROID_INTEGRATION_NDK_ARCH: x86_64
        ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/27.2.12479018
        NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/27.2.12479018
      run: chmod +x scripts/android-integration-ci.sh && ./scripts/android-integration-ci.sh prebuild
